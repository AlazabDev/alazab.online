name: Security CI

on:
  push:
    branches:
      - codex
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: security-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Refresh dependency lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Commit refreshed lockfile on Codex branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/codex'
        shell: bash
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore: refresh pnpm security lockfile"
          git push origin HEAD:codex

      - name: TypeScript check
        run: pnpm run typecheck

      - name: Production build
        run: pnpm run build

      - name: Production dependency audit
        run: pnpm run security:audit
